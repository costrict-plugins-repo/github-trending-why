<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="what-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="how-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="why-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/>
    <line x1="640" y1="0" x2="640" y2="200"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="3" rx="0" fill="url(#accent)"/>

  <!-- WHY title -->
  <text x="60" y="90" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="8">WHY</text>
  
  <!-- Subtitle -->
  <text x="60" y="125" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="1">Combat cognitive debt from AI-assisted development</text>

  <!-- Three tier badges -->
  <!-- WHAT -->
  <rect x="440" y="50" width="90" height="32" rx="6" fill="url(#what-grad)" opacity="0.9"/>
  <text x="485" y="71" font-family="'SF Mono', monospace" font-size="13" font-weight="600" fill="#0f0f1a" text-anchor="middle">WHAT</text>
  
  <!-- HOW -->
  <rect x="545" y="50" width="80" height="32" rx="6" fill="url(#how-grad)" opacity="0.9"/>
  <text x="585" y="71" font-family="'SF Mono', monospace" font-size="13" font-weight="600" fill="#0f0f1a" text-anchor="middle">HOW</text>
  
  <!-- WHY -->
  <rect x="640" y="50" width="80" height="32" rx="6" fill="url(#why-grad)" opacity="0.9"/>
  <text x="680" y="71" font-family="'SF Mono', monospace" font-size="13" font-weight="600" fill="#0f0f1a" text-anchor="middle">WHY</text>

  <!-- Arrow flow between badges -->
  <text x="536" y="71" font-family="sans-serif" font-size="14" fill="#475569">→</text>
  <text x="626" y="71" font-family="sans-serif" font-size="14" fill="#475569">→</text>

  <!-- Tier descriptions -->
  <text x="485" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Identify</text>
  <text x="585" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Trace</text>
  <text x="680" y="102" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Justify</text>

  <!-- Quiz indicator -->
  <rect x="440" y="120" width="280" height="44" rx="8" fill="#ffffff" opacity="0.05"/>
  <text x="456" y="138" font-family="'SF Mono', monospace" font-size="10" fill="#6366f1">$</text>
  <text x="468" y="138" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8">quiz me</text>
  <text x="456" y="155" font-family="'SF Mono', monospace" font-size="10" fill="#22c55e">✓</text>
  <text x="468" y="155" font-family="'SF Mono', monospace" font-size="10" fill="#64748b">Score: 4/5 — WHAT 2/2 · HOW 1/2 · WHY 1/1</text>

  <!-- Bottom tagline -->
  <text x="60" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#475569">60 seconds of forced recall. Zero additional cost. Any stack.</text>
</svg>
